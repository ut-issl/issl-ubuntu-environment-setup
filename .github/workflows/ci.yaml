name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  determine-changes:
    name: Determine changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      github_actions: ${{ steps.changed-files.outputs.github_actions_any_changed }}
      github_actions_ci: ${{ steps.changed-files.outputs.github_actions_ci_any_changed }}
      pre_commit_config: ${{ steps.changed-files.outputs.pre_commit_config_any_changed }}
      renovate_config: ${{ steps.changed-files.outputs.renovate_config_any_changed }}
      nix: ${{ steps.changed-files.outputs.nix_any_changed }}
      sh_bash: ${{ steps.changed-files.outputs.sh_bash_any_changed }}
      zsh: ${{ steps.changed-files.outputs.zsh_any_changed }}
      md: ${{ steps.changed-files.outputs.md_any_changed }}
      json5: ${{ steps.changed-files.outputs.json5_any_changed }}
      json5_files: ${{ steps.changed-files.outputs.json5_all_changed_files }}
      toml: ${{ steps.changed-files.outputs.toml_any_changed }}
      yaml: ${{ steps.changed-files.outputs.yaml_any_changed }}
      python: ${{ steps.changed-files.outputs.python_any_changed }}

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          safe_output: false
          separator: "\n"
          files_yaml: |
            github_actions:
              - .github/workflows/**
              - .github/actionlint.yaml
            github_actions_ci:
              - .github/workflows/ci.yaml
            pre_commit_config:
              - .pre-commit-config.yaml
            renovate_config:
              - .github/renovate.json5
            nix:
              - '**/*.nix'
              - flake.lock
            sh_bash:
              - '**/*.sh'
              - '**/*.bash'
            zsh:
              - '**/*.zsh'
            md:
              - '**/*.md'
              - .rumdl.toml
              - lychee.toml
            json5:
              - '**/*.json5'
            toml:
              - '**/*.toml'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
              - .yamllint.yaml
            python:
              - '**/*.py'
              - '**/*.md'
              - pyproject.toml
              - .python-version
              - uv.lock
              - .ruff.toml

  lint-gh-actions:
    name: Lint GitHub Actions
    needs: determine-changes
    if: ${{ needs.determine-changes.outputs.github_actions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        if: github.event_name != 'pull_request'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Run actionlint (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error

  audit-zizmor:
    name: Audit with zizmor
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.github_actions == 'true' ||
      needs.determine-changes.outputs.pre_commit_config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: false
          annotations: true

      - name: Run zizmor (SARIF upload)
        if: >-
          ${{
            always() &&
            github.event.repository.private == false &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository)
          }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 'v1.30.1'
          advanced-security: true

  validate-renovate-config:
    name: Validate Renovate config
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.renovate_config == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate Renovate config
        run: |
          npx --yes --package renovate@44.65.5 \
            renovate-config-validator .github/renovate.json5

  lint-nix:
    name: Lint Nix
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.nix == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Nix files
        id: nix-files
        shell: bash
        run: |
          nix_files_path="$(mktemp)"
          find . -type f -name '*.nix' -not -path './.git/*' -print0 > "${nix_files_path}"
          echo "nix_files=${nix_files_path}" >> "$GITHUB_OUTPUT"
          if [ ! -s "${nix_files_path}" ]; then
            echo "No Nix files found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Nix format
        if: steps.nix-files.outputs.found == 'true'
        shell: bash
        env:
          NIX_FILES: ${{ steps.nix-files.outputs.nix_files }}
        run: xargs -0 nix fmt -- --check < "${NIX_FILES}"

      - name: Run deadnix
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .

      - name: Run statix
        run: nix run --inputs-from . nixpkgs#statix -- check .

      - name: Run flake check
        run: |
          if [ -f flake.nix ]; then
            nix flake check --all-systems --show-trace
          else
            echo "No flake.nix found. Skipping flake check."
          fi

  lint-sh-bash:
    name: Lint sh/Bash
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.sh_bash == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shell tools
        shell: bash
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@a3f0c75d21d918756fa38de8b5d3429efde7948b # v3.14.1
          sudo apt-get update
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            sudo apt-get install -y shellcheck
          fi

      - name: Collect sh/bash files
        id: sh-bash-files
        shell: bash
        run: |
          sh_bash_files_path="$(mktemp)"
          find . -type f \( \
            -name '*.sh' -o \
            -name '*.bash' \
          \) -not -path './.git/*' -print0 > "${sh_bash_files_path}"
          echo "sh_bash_files=${sh_bash_files_path}" >> "$GITHUB_OUTPUT"
          if [ ! -s "${sh_bash_files_path}" ]; then
            echo "No sh/bash files found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shfmt
        if: steps.sh-bash-files.outputs.found == 'true'
        shell: bash
        env:
          SH_BASH_FILES: ${{ steps.sh-bash-files.outputs.sh_bash_files }}
        run: |
          xargs -0 "$(go env GOPATH)/bin/shfmt" --diff --simplify -i 2 < "${SH_BASH_FILES}"

      - name: Run shellcheck
        if: github.event_name != 'pull_request' && steps.sh-bash-files.outputs.found == 'true'
        shell: bash
        env:
          SH_BASH_FILES: ${{ steps.sh-bash-files.outputs.sh_bash_files }}
        run: |
          xargs -0 shellcheck --external-sources < "${SH_BASH_FILES}"

      - name: Run shellcheck (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-shellcheck@a94d585085f1f5215ae65f4de34e7bbd0523d550 # v1.33.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error
          pattern: |
            *.sh
            *.bash

  lint-zsh:
    name: Lint Zsh
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.zsh == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zsh tools
        shell: bash
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@a3f0c75d21d918756fa38de8b5d3429efde7948b # v3.14.1
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Collect Zsh files
        id: zsh-files
        shell: bash
        run: |
          zsh_files_path="$(mktemp)"
          find . -type f -name '*.zsh' -not -path './.git/*' -print0 > "${zsh_files_path}"
          echo "zsh_files=${zsh_files_path}" >> "$GITHUB_OUTPUT"
          if [ ! -s "${zsh_files_path}" ]; then
            echo "No Zsh files found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run shfmt
        if: steps.zsh-files.outputs.found == 'true'
        shell: bash
        env:
          ZSH_FILES: ${{ steps.zsh-files.outputs.zsh_files }}
        run: |
          xargs -0 "$(go env GOPATH)/bin/shfmt" --language-dialect zsh --diff --simplify -i 2 < "${ZSH_FILES}"

      - name: Check Zsh syntax
        if: steps.zsh-files.outputs.found == 'true'
        shell: bash
        env:
          ZSH_FILES: ${{ steps.zsh-files.outputs.zsh_files }}
        run: |
          xargs -0 -n 1 zsh -n < "${ZSH_FILES}"

  lint-markdown:
    name: Lint Markdown
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.md == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: rvben/rumdl@41e15c580461c971819816143d4e43c636647674 # v0.2.75
        with:
          version: '0.2.75'
          report-type: annotations

  check-links:
    name: Check links
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.md == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: 'v0.24.2'
          args: '--no-progress .'

  lint-json5:
    name: Lint JSON5
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.json5 == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check JSON5 syntax
        env:
          CHANGED_JSON5_FILES: ${{ needs.determine-changes.outputs.json5_files }}
        run: |
          readarray -t json5_files < <(
            printf '%s\n' "${CHANGED_JSON5_FILES}" | sed '/^$/d'
          )
          if [ ${#json5_files[@]} -eq 0 ]; then
            readarray -d '' -t json5_files < <(
              find . -type f -name '*.json5' -not -path './.git/*' -print0
            )
          fi
          if [ ${#json5_files[@]} -eq 0 ]; then
            echo 'No JSON5 files found.'
            exit 0
          fi
          exit_code=0
          for json5_file in "${json5_files[@]}"; do
            npx --yes json5@2.2.3 --validate "$json5_file" || exit_code=1
          done
          exit $exit_code

  lint-toml:
    name: Lint TOML
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.toml == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@ea139001852855a7f1cf30a9b60c71ebb6446a99 # v1.5.5
        with:
          version: '1.5.5'

      - name: Lint TOML
        if: github.event_name != 'pull_request'
        run: tombi lint

      - name: Set up reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: 'v0.21.2'

      - name: Lint TOML (reviewdog)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: '1'
        run: |
          lint_rc=0
          tombi lint --quiet > /tmp/tombi-lint-report.txt 2>&1 || lint_rc=$?
          gawk '
            match($0, /^[[:space:]]*(Warning|Error):[[:space:]]*(.*)$/, m) {
              severity = m[1]; message = m[2]; next
            }
            match($0, /^[[:space:]]*at[[:space:]]+(.*):([0-9]+):([0-9]+)/, m) {
              printf "%s:%s:%s: %s: %s\n", m[1], m[2], m[3], substr(severity, 1, 1), message
            }
          ' /tmp/tombi-lint-report.txt > /tmp/tombi-lint-report.efm.txt
          reviewdog_rc=0
          reviewdog < /tmp/tombi-lint-report.efm.txt \
              -efm="%f:%l:%c: %t: %m" \
              -name=tombi-lint \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -fail-level=error || reviewdog_rc=$?
          if [ $lint_rc -ne 0 ] && [ ! -s /tmp/tombi-lint-report.efm.txt ]; then
            echo "::error title=tombi::tombi lint failed before producing parseable diagnostics"
            cat /tmp/tombi-lint-report.txt
            exit $lint_rc
          fi
          exit $reviewdog_rc

      - name: Format TOML
        run: tombi format

      - name: Suggest TOML format changes (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@4553543bea739d9d503379d786148cfd561de5fa # v1.25.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: tombi-format
          cleanup: 'false'

      - name: Check TOML format
        run: git diff --exit-code

  lint-yaml:
    name: Lint YAML
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.yaml == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'

      - name: Lint YAML
        if: github.event_name != 'pull_request'
        run: uvx --from "yamllint==1.38.0" yamllint .

      - name: Lint YAML (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-yamllint@6803b0dc8f295034a6156b924814053acb2e6f5a # v1.24.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error
          yamllint_flags: .

  lint-python:
    name: Lint Python
    needs: determine-changes
    if: >-
      ${{ needs.determine-changes.outputs.python == 'true' ||
      needs.determine-changes.outputs.github_actions_ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.17'

      - name: Lint with Ruff
        if: github.event_name != 'pull_request'
        run: uvx --from "ruff==0.16.8" ruff check . --output-format=github

      - name: Set up reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: 'v0.21.2'

      - name: Lint with Ruff (reviewdog)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff_rc=0
          uvx --from "ruff==0.16.8" ruff check . --output-format=rdjson > /tmp/ruff-report.json || ruff_rc=$?
          reviewdog_rc=0
          reviewdog < /tmp/ruff-report.json \
              -f=rdjson \
              -name=ruff \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -fail-level=warning \
              -tee || reviewdog_rc=$?
          if [ $ruff_rc -ne 0 ] && [ ! -s /tmp/ruff-report.json ]; then
            echo "::error title=ruff::ruff failed before producing diagnostics for reviewdog"
            exit $ruff_rc
          fi
          exit $reviewdog_rc

      - name: Format Python
        run: uvx --from "ruff==0.16.8" ruff format .

      - name: Suggest Python format changes (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-suggester@4553543bea739d9d503379d786148cfd561de5fa # v1.25.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: ruff-format
          cleanup: 'false'

      - name: Check Python format
        run: git diff --exit-code

  check-prek:
    name: Check prek
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 'v0.5.3'
          extra-args: '--all-files --skip no-commit-to-branch'

  check-typos:
    name: Check typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        if: github.event_name != 'pull_request'
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

      - name: Check spelling (reviewdog)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-typos@d5eb1bbcd1b3bfde596f6eeb470322727862fe98 # v1.19.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: error
          typos_flags: .

  lint-commit-messages:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Commitizen
        uses: commitizen-tools/setup-cz@96c75e6ae9632047f2c9b4025b9dd1624b40de8f # v0.9.1
        with:
          python-version: '3.x'
          version: '4.18.1'

      - name: Lint commit messages on push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice title=cz check::Base commit unavailable (new branch or force push); skipping lint."
            exit 0
          fi
          cz check --rev-range "${BEFORE_SHA}..${HEAD_SHA}"

      - name: Lint commit messages on pull request
        if: github.event_name == 'pull_request'
        run: cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
