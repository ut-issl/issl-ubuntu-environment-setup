name: Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yaml
      - .github/workflows/test-config-repository.yaml
      - assets/**
      - flake.nix
      - flake.lock
      - home-modules/**
      - scripts/apply.sh
      - scripts/bootstrap-host.sh
      - scripts/setup.sh
      - tests/**
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/test.yaml
      - .github/workflows/test-config-repository.yaml
      - assets/**
      - flake.nix
      - flake.lock
      - home-modules/**
      - scripts/apply.sh
      - scripts/bootstrap-host.sh
      - scripts/setup.sh
      - tests/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  script-based:
    name: Test script-based setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        entry-point:
          - apply
          - setup
        zsh:
          - enabled
          - disabled
        include:
          - zsh: enabled
            enable_zsh: "1"
          - zsh: disabled
            enable_zsh: "0"

    steps:
      - name: Checkout common repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: common
          persist-credentials: false

      - name: Install Nix
        if: matrix.entry-point != 'setup'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare test environment
        id: test-env
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          home_dir="${tmpdir}/home"

          # Seed the test HOME with the default Ubuntu skeleton dotfiles (~/.bashrc, ~/.profile, ~/.bash_logout).
          mkdir -p "${home_dir}"
          cp -a /etc/skel/. "${home_dir}/"

          {
            echo "home_dir=${home_dir}"
            echo "config_dir=${home_dir}/.config"
            echo "data_dir=${home_dir}/.local/share"
            echo "state_dir=${home_dir}/.local/state"
          } >> "$GITHUB_OUTPUT"

      - name: Run apply.sh
        if: matrix.entry-point == 'apply'
        shell: bash
        env:
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
          CONFIG_DIR: ${{ steps.test-env.outputs.config_dir }}
          DATA_DIR: ${{ steps.test-env.outputs.data_dir }}
          STATE_DIR: ${{ steps.test-env.outputs.state_dir }}
          ENABLE_ZSH: ${{ matrix.enable_zsh }}
        run: |
          env \
            HOME="${HOME_DIR}" \
            USER="issl-test" \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            ISSL_ENABLE_ZSH="${ENABLE_ZSH}" \
            GIT_USER_NAME="ISSL Test User" \
            GIT_USER_EMAIL="issl-test@example.com" \
            bash ./common/scripts/apply.sh

      - name: Run setup.sh
        if: matrix.entry-point == 'setup'
        shell: bash
        env:
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
          CONFIG_DIR: ${{ steps.test-env.outputs.config_dir }}
          DATA_DIR: ${{ steps.test-env.outputs.data_dir }}
          STATE_DIR: ${{ steps.test-env.outputs.state_dir }}
          ENABLE_ZSH: ${{ matrix.enable_zsh }}
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C common branch ci-setup-entry HEAD

          env \
            HOME="${HOME_DIR}" \
            USER="issl-test" \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            REPO_URL="file://${GITHUB_WORKSPACE}/common" \
            REPO_REF="ci-setup-entry" \
            ISSL_INSTALL_DOCKER=no \
            ISSL_ENABLE_ZSH="${ENABLE_ZSH}" \
            GIT_USER_NAME="ISSL Test User" \
            GIT_USER_EMAIL="issl-test@example.com" \
            bash ./common/scripts/setup.sh

          echo "/nix/var/nix/profiles/default/bin" >>"${GITHUB_PATH}"

      - name: Add Home Manager profile to PATH
        shell: bash
        env:
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
        run: echo "${HOME_DIR}/.nix-profile/bin" >> "${GITHUB_PATH}"

      - name: Run environment tests
        shell: bash
        env:
          COMMON_DIR: ${{ github.workspace }}/common
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
          CONFIG_DIR: ${{ steps.test-env.outputs.config_dir }}
          ISSL_ENABLE_ZSH: ${{ matrix.enable_zsh }}
          EXPECTED_GIT_USER_NAME: ISSL Test User
          EXPECTED_GIT_USER_EMAIL: issl-test@example.com
        run: ./common/tests/run.sh

  repository-based:
    name: Test config-repository-based setup
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        flake-target:
          - user
    uses: ./.github/workflows/test-config-repository.yaml
    with:
      os: ${{ matrix.os }}
      flake-target: ${{ matrix.flake-target }}
      zsh-enabled: false
      common-repository: ${{ github.repository }}
      common-ref: ${{ github.sha }}
      user-repository: ut-issl/personal-nix-config-template
      user-ref: 21ef6cbfec811abed6dd7f8db465c1d04ec0aed8 # main
      override-issl-input: true
      timeout-minutes: 15
