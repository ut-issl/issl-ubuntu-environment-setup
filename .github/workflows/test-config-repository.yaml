name: Test config repository

on:
  workflow_call:
    inputs:
      os:
        required: false
        default: ubuntu-latest
        type: string
      flake-target:
        required: false
        default: user
        type: string
      zsh-enabled:
        required: false
        default: true
        type: boolean
      common-repository:
        required: false
        default: ut-issl/issl-ubuntu-environment-setup
        type: string
      common-ref:
        required: false
        default: main
        type: string
      user-repository:
        required: false
        default: ''
        type: string
      user-ref:
        required: false
        default: ''
        type: string
      override-issl-input:
        required: false
        default: false
        type: boolean
      timeout-minutes:
        required: false
        default: 10
        type: number

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout common repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.common-repository }}
          ref: ${{ inputs.common-ref }}
          persist-credentials: false
          path: common

      - name: Checkout user repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.user-repository }}
          ref: ${{ inputs.user-ref }}
          persist-credentials: false
          path: user

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare test environment
        id: test-env
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          home_dir="${tmpdir}/home"

          # Seed the test HOME with the default Ubuntu skeleton dotfiles (~/.bashrc, ~/.profile, ~/.bash_logout).
          mkdir -p "${home_dir}"
          cp -a /etc/skel/. "${home_dir}/"

          {
            echo "home_dir=${home_dir}"
            echo "config_dir=${home_dir}/.config"
            echo "data_dir=${home_dir}/.local/share"
            echo "state_dir=${home_dir}/.local/state"
          } >> "$GITHUB_OUTPUT"

      - name: Apply Home Manager configuration
        shell: bash
        env:
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
          CONFIG_DIR: ${{ steps.test-env.outputs.config_dir }}
          DATA_DIR: ${{ steps.test-env.outputs.data_dir }}
          STATE_DIR: ${{ steps.test-env.outputs.state_dir }}
          FLAKE_TARGET: ${{ inputs.flake-target }}
        run: |
          cd user

          switch_args=(
            --impure
            --show-trace
          )

          if [ "${{ inputs.override-issl-input }}" = "true" ]; then
            switch_args+=(
              --override-input
              issl
              "path:${GITHUB_WORKSPACE}/common"
            )
          fi

          env \
            HOME="${HOME_DIR}" \
            USER="issl-test" \
            XDG_CONFIG_HOME="${CONFIG_DIR}" \
            XDG_DATA_HOME="${DATA_DIR}" \
            XDG_STATE_HOME="${STATE_DIR}" \
            nix run ".#home-manager" -- \
              switch --flake ".#${FLAKE_TARGET}" "${switch_args[@]}"

      - name: Add Home Manager profile to PATH
        shell: bash
        env:
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
        run: echo "${HOME_DIR}/.nix-profile/bin" >> "${GITHUB_PATH}"

      - name: Run environment tests
        shell: bash
        env:
          COMMON_DIR: ${{ github.workspace }}/common
          HOME_DIR: ${{ steps.test-env.outputs.home_dir }}
          CONFIG_DIR: ${{ steps.test-env.outputs.config_dir }}
          STATE_DIR: ${{ steps.test-env.outputs.state_dir }}
          ISSL_ENABLE_ZSH: ${{ case(inputs.zsh-enabled, '1', '0') }}
        run: ./common/tests/run.sh
