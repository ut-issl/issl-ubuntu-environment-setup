name: Bump version

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  bump-version:
    name: Bump version
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bump version
        id: bump-version
        uses: conjikidow/bump-version-action@f63d3275c47f3bf6348d6f58e47e9aee5addd55b # v4.2.3
        with:
          label-major: update::major
          label-minor: update::minor
          label-patch: update::patch
          manual-bump-type: ${{ inputs.bump-type }}
          labels-to-add: automated,versioning
          create-release: false
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Prepare release asset
        if: steps.bump-version.outputs.version-bumped == 'true'
        run: |
          mkdir -p release-assets
          cp scripts/bootstrap-host.sh release-assets/bootstrap-host.sh
          cp scripts/setup.sh release-assets/setup.sh

      - name: Publish GitHub release
        if: steps.bump-version.outputs.version-bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ steps.bump-version.outputs.new-version }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/bootstrap-host.sh release-assets/setup.sh \
            --title="${RELEASE_TAG}" \
            --generate-notes
