---
default_stages: [pre-commit]

update:
  repos:
    "https://github.com/lycheeverse/lychee":
      include_tags: ["lychee-v*"]

repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix fmt --
        language: system
        files: \.nix$

      - id: deadnix
        name: deadnix
        entry: nix run --inputs-from . nixpkgs#deadnix -- --fail .
        language: system
        files: \.nix$
        pass_filenames: false

      - id: statix
        name: statix
        entry: nix run --inputs-from . nixpkgs#statix -- check .
        language: system
        files: \.nix$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461  # frozen: v1.50.3
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb  # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-w", "-s", "-i", "2"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
    hooks:
      - id: shellcheck
        exclude: \.zsh$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: cbd02203fbbb2839cd7e25e3062628ba4af18991  # frozen: v0.2.77
    hooks:
      - id: rumdl
        args: ["--fix"]

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b  # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        args: ["--offline", "--no-progress", "."]
        pass_filenames: false

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: b5c820aff664ac92018905d023a7c7e9e25ed1e4  # frozen: v1.5.8
    hooks:
      - id: tombi-format
      - id: tombi-lint

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict", "-c=.yamllint.yaml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce  # frozen: v4.19.0
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push
